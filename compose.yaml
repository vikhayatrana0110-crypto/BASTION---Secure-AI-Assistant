services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: bastion_owner
      POSTGRES_PASSWORD: bastion_owner
      POSTGRES_DB: bastion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bastion_owner", "-d", "bastion"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata: