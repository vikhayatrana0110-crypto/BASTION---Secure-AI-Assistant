name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
        
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: bastion_owner
          POSTGRES_PASSWORD: bastion_owner
          POSTGRES_DB: bastion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bastion_owner -d bastion"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      
      - run: uv sync --locked --extra web

      - run: psql "postgresql://bastion_owner:bastion_owner@localhost:5432/bastion" -v ON_ERROR_STOP=1 -f scripts/create_roles.sql

      - run: uv run ruff check .

      - run: uv run pytest